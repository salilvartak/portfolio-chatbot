services:
  - type: web
    name: portfolio-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m ingest.run
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SITE_URL
        value: https://vartak.online
      - key: CONTACT_EMAIL
        sync: false
      - key: FALLBACK_MODELS
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
